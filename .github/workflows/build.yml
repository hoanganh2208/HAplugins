name: Build

# Tự build plugin mỗi lần push, hoặc bấm tay ở tab Actions -> Build -> Run workflow.
# Kết quả (file .cs3 + plugins.json) được đẩy lên nhánh "builds". Nhánh này tự tạo nếu chưa có.

concurrency:
  group: build
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      # Checkout lần 2 để có thư mục git đã có sẵn quyền push, dùng cho nhánh builds.
      - name: Checkout (cho nhánh builds)
        uses: actions/checkout@v4
        with:
          path: builds

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
