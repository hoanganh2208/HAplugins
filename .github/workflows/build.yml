name: Build

concurrency:
  group: build
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
    paths-ignore: ['*.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with: { path: src }

      - name: Checkout builds
        uses: actions/checkout@v4
        with: { path: builds }

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }

      - name: Build plugins
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Push to builds branch
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout --orphan builds-out
          git rm -rf --quiet .
          find "$GITHUB_WORKSPACE/src" -path '*/build/*.cs3' -exec cp {} . \;
          cp "$GITHUB_WORKSPACE/src/build/plugins.json" .
          ls -la
          git add .
          git commit -m "Build $GITHUB_SHA"
          git push --force origin HEAD:refs/heads/builds
